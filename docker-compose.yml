# CVolve — `docker compose up -d`, then open http://localhost:8080
# Settings: docker/defaults.env, overridden by .env.docker (copy .env.example).
# Development overrides (live code, debug): docker-compose.dev.yml
name: cvolve

x-env: &env
  env_file:
    - path: docker/defaults.env
    - path: .env.docker
      required: false

x-app: &app
  <<: *env
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: cvolve-app
  volumes:
    - storage:/var/www/html/var/storage
  depends_on:
    database:
      condition: service_healthy
    gotenberg:
      condition: service_started
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "${CVOLVE_PORT:-8080}:80"
    environment:
      CVOLVE_ROLE: web

  messenger-worker:
    <<: *app
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    environment:
      CVOLVE_ROLE: worker
    depends_on:
      app:
        condition: service_started

  database:
    <<: *env
    image: postgres:16-alpine
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  gotenberg:
    # Chromium renders the HTML templates to A4 PDFs; only inline (data:) resources may load
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--chromium-deny-list=^(?!data:|file:///tmp/).*", "--api-timeout=60s"]
    restart: unless-stopped

  mailer:
    # Catches outgoing email: http://localhost:8025 (set MAILER_DSN to a real SMTP server in production)
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  database:
  storage:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, gd, pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate the Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync --env=test

      - name: Lint Twig, YAML and the container
        run: |
          php bin/console lint:twig templates
          php bin/console lint:yaml config
          php bin/console lint:container

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: |
          php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker build -f docker/Dockerfile -t cvolve-app .
